/* Larger material specimens with shared textures in picker, close-up and spool. */
.finish-picker{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.finish-picker button{padding:6px 6px 10px;text-align:left;border-radius:13px;position:relative;overflow:hidden;min-width:0;background:#20242b;transition:border-color .15s,background .15s}
.finish-picker button[aria-pressed=true]{border-color:var(--accent);background:#283122;box-shadow:0 0 0 1px #c2f67c22}
.finish-picker button[aria-pressed=true]::after{content:'✓';position:absolute;right:12px;top:12px;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:800;box-shadow:0 2px 10px #0003}
.material-sample{position:relative;isolation:isolate;overflow:hidden;height:62px;width:100%;border-radius:8px;background-color:var(--spool-color);background-image:linear-gradient(145deg,#ffffff4d,transparent 45%,#00000038);box-shadow:inset 0 0 0 1px #ffffff0f}
.material-sample::before{content:'';position:absolute;inset:-30%;transform:rotate(-18deg);background:repeating-linear-gradient(0deg,transparent 0 5px,#00000010 5.4px 6px,#ffffff15 6.4px 7px);pointer-events:none}
.material-sample::after{content:'';position:absolute;inset:0;pointer-events:none}
.finish-title{display:block;margin:8px 5px 0;font-size:12px;line-height:1.3;font-weight:650;color:var(--ink)}
.finish-description{display:block;margin:3px 5px 0;font-size:10px;line-height:1.35;color:var(--muted)}
.surface-matte :is(.filament,.material-sample){background-image:linear-gradient(145deg,#ffffff13,transparent 65%,#00000018)}
.surface-matte .filament{background-image:repeating-radial-gradient(circle,transparent 0 1px,#00000012 1.6px 2px),linear-gradient(145deg,#ffffff13,transparent 65%,#00000018)}
.surface-matte .material-sample::before{opacity:.2}

.surface-stone .material-sample::before{opacity:.12}
.surface-silk .material-sample::after{background:linear-gradient(113deg,transparent 10%,#ffffffb0 36%,#ffffff15 50%,transparent 68%,#00000038 90%)}
.surface-metallic .material-sample::after{background:linear-gradient(105deg,#0006,transparent 20%,#fffc 33%,#0006 49%,#fff8 66%,transparent 83%,#0006)}
.surface-translucent .material-sample{opacity:.7;background-image:linear-gradient(130deg,#ffffff88,transparent 40%,#ffffff22)}
.surface-cf .material-sample::after{background:repeating-linear-gradient(45deg,#0005 0 2px,transparent 2px 5px),repeating-linear-gradient(-45deg,#fff1 0 2px,transparent 2px 5px)}
.surface-wood .material-sample::after{background:repeating-linear-gradient(82deg,#0003 0 1px,transparent 2px 7px)}
.surface-glow .material-sample{box-shadow:inset 0 0 20px #fff6,0 0 14px color-mix(in srgb,var(--spool-color) 25%,transparent)}
.preview-box{padding:17px;display:grid;grid-template-columns:1fr;gap:15px;border-radius:15px;background:#20242a}
.preview-material{position:relative;border-radius:10px;overflow:hidden;min-width:0}
.preview-material .material-sample{height:130px;border-radius:10px}
.preview-material .material-sample::before{background:repeating-linear-gradient(0deg,transparent 0 8px,#00000010 8.4px 9px,#ffffff15 9.4px 10px)}
.preview-material .surface-galaxy .material-sample::after{background-size:240px 160px,100% 100%}
.preview-caption{display:flex;align-items:center;justify-content:space-between;gap:12px}
.preview-caption .preview-label{font-size:10px;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);white-space:nowrap}
.preview-caption strong{font-size:17px}
.preview-caption p{font-size:12px;color:var(--muted);margin-top:2px}
.preview-spool{position:absolute;right:12px;bottom:7px;filter:drop-shadow(0 6px 12px #0005)}
.preview-spool .spool{width:78px;height:78px;transform:rotate(-18deg);margin:0;border-width:4px}
.preview-spool .filament{width:59px;height:59px}
.preview-spool .core{inset:26px;border-width:4px}
.preview-spool .surface-galaxy .filament::after{background-size:130px 87px,100% 100%}
@media(max-width:700px){.finish-picker{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.material-sample{height:58px}.finish-title{font-size:11px}.finish-description{font-size:10px;margin-top:2px}.preview-material .material-sample{height:118px}.preview-caption .preview-label{font-size:9px;max-width:80px;white-space:normal;text-align:right}}
@media(max-width:360px){.finish-picker{grid-template-columns:repeat(2,minmax(0,1fr))}.material-sample{height:64px}.finish-title{font-size:12px}.finish-description{font-size:11px}}

/* Consistent disclosure arrows and a fully visible brand palette. */
.select-shell{position:relative}.select-shell select{appearance:none;-webkit-appearance:none;padding-right:36px}
.select-shell::after,.brand-trigger::after{content:'';position:absolute;right:15px;top:50%;width:7px;height:7px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.brand-field{position:relative}.brand-trigger{position:relative;width:100%;min-height:46px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 36px 11px 12px;text-align:left;color:var(--ink);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-options{position:absolute;z-index:10;right:0;top:calc(100% + 7px);width:min(460px,calc(100vw - 68px));padding:12px;background:#24282f;border:1px solid #444c57;border-radius:13px;box-shadow:0 15px 40px #0007}
.brand-options[hidden]{display:none}.brand-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.brand-grid button{min-height:42px;border-radius:7px;background:#323841;padding:8px 5px;font-size:12px;overflow-wrap:anywhere}.brand-grid button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}.brand-custom{display:flex;align-items:center;gap:9px;margin-top:10px}.brand-custom span{font-size:11px;color:var(--muted);flex-shrink:0}.brand-custom input{min-width:0;font-size:14px;padding:8px}.brand-done{margin-top:9px;width:100%;padding:8px;background:transparent;color:var(--accent);font-size:12px}
.add-third{border:1px dashed #677d4c;color:var(--accent);background:transparent;border-radius:8px;padding:8px;font-size:11px;min-height:42px}.remove-third{background:transparent;color:var(--muted);min-height:42px;padding:5px 8px}.add-third[hidden],.remove-third[hidden]{display:none}
@media(max-width:380px){.brand-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.brand-options{width:calc(100vw - 68px)}}

.material-field{position:relative}.material-options{left:0;right:auto}

/* Persistent bottom actions, with space for the iPhone home indicator. */
.action-dock{position:fixed;bottom:0;left:210px;right:0;z-index:30;border-top:1px solid #ffffff12;background:#14171bef;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:13px 24px calc(13px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px #0003}
.dock-inner{max-width:1120px;margin:auto;display:flex;align-items:center;gap:12px}.dock-inner .search-wrap{min-width:0}.dock-inner .search-wrap input{min-height:48px;background:#22262d;border-color:#3b434d;font-size:16px}.dock-add{display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px;white-space:nowrap}.dock-add>span:first-child{font-size:21px;line-height:1}.stock-tools{display:flex;justify-content:flex-end;margin-bottom:14px}.stock-tools .sort{padding:9px 12px}.topline{margin-bottom:23px}main{padding-bottom:calc(130px + env(safe-area-inset-bottom,0px))}.toast{bottom:calc(101px + env(safe-area-inset-bottom,0px))}body:has(dialog[open]) .action-dock{visibility:hidden}

/* Compact page header: inventory first, controls in one wrapping row. */
main{padding-top:22px}.page-head{align-items:center;margin-bottom:12px;gap:14px}.page-head h1{font-size:30px;letter-spacing:-1px;line-height:1.15}.page-head .total{display:flex;align-items:baseline;gap:6px}.page-head .total b{font-size:23px}.page-head .total span{font-size:12px}.summary-strip{margin-bottom:14px;gap:12px;flex-wrap:wrap}.summary-strip button{padding:4px 9px}.filters{gap:7px}.filters .sort{width:auto;max-width:145px;padding:8px 10px;font-size:12px}.result-bar{margin-top:13px;margin-bottom:11px}

<script>
'use strict';
const DEMO = location.pathname.includes('Vorschau') || new URLSearchParams(location.search).has('demo');
const MAT_OPTIONS=['PLA','PLA+','PETG','ABS','ASA','TPU','PC','PA','Wood','Carbon'];
const BRANDS=['Bambu Lab','Prusa','eSun','Sunlu','Polymaker','Elegoo','Spectrum','Extrudr','Das Filament','FIBERLOGY','FormFutura','Andere'];
const FINISHES={plain:'Standard',matte:'Matt',galaxy:'Glitzer',silk:'Seide / Silk',metallic:'Metallisch',translucent:'Transparent',stone:'Stein',cf:'Carbon',wood:'Holz',glow:'Nachleuchtend',photo:'Foto',rainbow:'Mehrfarbig'};
const SWATCHES=[['Weiss','#ffffff'],['Beige','#f5efdc'],['Schwarz','#16181b'],['Grau','#9ca3af'],['Rot','#ed4747'],['Orange','#f29035'],['Gelb','#f4d345'],['Grün','#54a76c'],['Blau','#568dda'],['Violett','#a47bdb'],['Pink','#e892b3']];
const DEMO_SPOOLS=[{number:1,material:'PLA',color:'White',hex:'#ffffff',look:'matte',brand:'Bambu Lab',capacity:1000,level:100},{number:2,material:'PLA',color:'Beige',hex:'#f5efdc',look:'plain',brand:'eSun',capacity:1000,level:75},{number:3,material:'PLA',color:'Galaxy Black',hex:'#212530',look:'galaxy',brand:'Prusa',capacity:1000,level:50},{number:4,material:'PLA',color:'Neon Rainbow',hex:'#ffffff',look:'rainbow',brand:'Sunlu',capacity:1000,level:100},{number:5,material:'PETG',color:'Ocean Blue',hex:'#568dda',look:'silk',brand:'Bambu Lab',capacity:1000,level:25},{number:6,material:'PLA',color:'Sage Green',hex:'#a3b696',look:'matte',brand:'Polymaker',capacity:1000,level:12.5}].map(s=>({...s,createdAt:'2026-10-26T12:00:00.000Z',note:''}));
const STORE=DEMO?'fstudio_demo_':'fpool_';
function readStored(key,fallback){try{const v=JSON.parse(localStorage.getItem(STORE+key));return v??fallback;}catch{return fallback;}}
let spools=readStored('inv',DEMO?structuredClone(DEMO_SPOOLS):[]),shopItems=readStored('shop',[]),amsSlots=readStored('ams',[null,null,null,null]);
let materialFilter='',lowOnly=false,editDraft=null,editId=null,editContext='stock',shopSource=null,activeBooking=null,undoStack=[],db=null,cloudReady=false,cloudLoaded=false,unsentChanges=false,writeInFlight=false,cloudConflict=false,toastTimer,screen='stock';
let localRevision=0;
const $=id=>document.getElementById(id);
const escapeHTML=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normal=v=>String(v??'').toLowerCase().replace(/ß/g,'ss').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const grams=s=>Math.max(0,(Number(s.level)||0)/100*(Number(s.capacity)||1000));
const displayGrams=g=>new Intl.NumberFormat('de-CH',{maximumFractionDigits:1}).format(g);
const safeHex=h=>/^#[a-f0-9]{6}$/i.test(h||'')?h:'#b8bec7';
const isMulticolor=s=>Boolean(s.isMulticolor||s.gradient||s.look==='rainbow'||/rainbow|regenbogen|multicolou?r|mehrfarbig|verlauf|gradient|tri[- ]?colou?r|dual[- ]?colou?r|red-blue-green|gold-silver-copper/i.test(s.color||''));
function surface(s){if(s.surface&&FINISHES[s.surface])return s.surface;if(s.look==='rainbow')return /matte|matt/i.test(s.color)?'matte':/silk|seide/i.test(s.color)?'silk':'plain';if(FINISHES[s.look])return s.look;const n=normal(s.color);if(/glitzer|sparkle|galaxy|starlight/.test(n))return 'galaxy';if(/matte|matt/.test(n))return 'matte';if(/silk|seide/.test(n))return 'silk';return 'plain';}
const COLOR_GROUPS=[
 {id:'white',words:['white','weiss','creme','cream','ivory','elfenbein','bone','offwhite','off-white'],hex:'#ffffff',near:['beige']},
 {id:'beige',words:['beige','sand','champagne'],hex:'#f5efdc',near:['white']},
 {id:'black',words:['black','schwarz','onyx'],hex:'#16181b'},
 {id:'grey',words:['grey','gray','grau','anthracite','anthrazit'],hex:'#9ca3af'},
 {id:'blue',words:['blue','blau','navy','ocean'],hex:'#568dda'},
 {id:'green',words:['green','grun','sage','mint','olive'],hex:'#54a76c'},
 {id:'red',words:['red','rot','cherry','maroon'],hex:'#ed4747'},
 {id:'yellow',words:['yellow','gelb','lemon'],hex:'#f4d345'},
 {id:'orange',words:['orange','tangerine'],hex:'#f29035'},
 {id:'purple',words:['purple','violet','violett','lila','lilac','lavender'],hex:'#a47bdb'},
 {id:'pink',words:['pink','rosa','rose'],hex:'#e892b3'},
 {id:'brown',words:['brown','braun','coffee','chocolate','walnut'],hex:'#815239'},
 {id:'turquoise',words:['turquoise','turkis','cyan','teal'],hex:'#40c8c0'},
 {id:'gold',words:['gold','golden'],hex:'#ddbc50'},
 {id:'silver',words:['silver','silber'],hex:'#bfc4cb'}
];
const EFFECT_WORDS={glitzer:'galaxy',glitzernd:'galaxy',glitzernde:'galaxy',glitter:'galaxy',sparkle:'galaxy',galaxy:'galaxy',matt:'matte',matte:'matte',silk:'silk',seide:'silk',metallisch:'metallic',metallic:'metallic',transparent:'translucent',translucent:'translucent',verlauf:'rainbow',rainbow:'rainbow',regenbogen:'rainbow',mehrfarbig:'rainbow'};
function rgb(hex){const h=safeHex(hex);return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);}
function lab(hex){const v=rgb(hex).map(x=>x>.04045?Math.pow((x+.055)/1.055,2.4):x/12.92);const f=x=>x>.008856?Math.cbrt(x):7.787*x+16/116;const x=f((v[0]*.4124+v[1]*.3576+v[2]*.1805)/.95047),y=f(v[0]*.2126+v[1]*.7152+v[2]*.0722),z=f((v[0]*.0193+v[1]*.1192+v[2]*.9505)/1.08883);return [116*y-16,500*(x-y),200*(y-z)];}
function familyForName(name){const words=normal(name).split(/[^a-z0-9-]+/);return COLOR_GROUPS.find(g=>g.words.some(w=>words.includes(w)));}
function relatedColor(s,target){if(isMulticolor(s)||surface(s)==='photo')return false;const named=familyForName(s.color);if(named)return Boolean(target.near?.includes(named.id));if(!/^#[a-f0-9]{6}$/i.test(s.hex||''))return false;const a=lab(s.hex),b=lab(target.hex),distance=Math.hypot(...a.map((n,i)=>n-b[i]));if(['white','beige','grey','black','silver'].includes(target.id)&&Math.hypot(a[1],a[2])>20)return false;return distance<19;}
function searchMatch(s,query,similar=true){const terms=normal(query).trim().split(/\s+/).filter(Boolean);let related=false;const text=normal(`${s.number} ${s.material||''} ${s.brand||''} ${s.color||''} ${s.note||''}`);for(const term of terms){const color=COLOR_GROUPS.find(g=>g.words.includes(term));if(color){if(isMulticolor(s))return null;const named=familyForName(s.color);if(named?.id===color.id)continue;if(similar&&relatedColor(s,color)){related=true;continue;}return null;}
 const effect=EFFECT_WORDS[term];if(effect){if(effect==='rainbow'?isMulticolor(s):surface(s)===effect)continue;return null;}
 if(!text.includes(term.replace(/^#/,'')))return null;}return {spool:s,related};}
function filteredSpools(){const q=$('search').value;const similar=$('include-similar').checked;const effect=$('finish-filter').value;const sorted=spools.filter(s=>(!materialFilter||s.material===materialFilter)&&(!lowOnly||grams(s)<250)&&(effect===''||(effect==='rainbow'?isMulticolor(s):surface(s)===effect))).map(s=>searchMatch(s,q,similar)).filter(Boolean);const sort=$('sort').value;sorted.sort((a,b)=>{if(a.related!==b.related)return Number(a.related)-Number(b.related);if(sort==='recent')return String(b.spool.createdAt||'').localeCompare(String(a.spool.createdAt||''));if(sort==='weight')return grams(a.spool)-grams(b.spool);if(sort==='color')return String(a.spool.color).localeCompare(String(b.spool.color),'de');return a.spool.number-b.spool.number;});return sorted;}
function getGradient(s){if(!isMulticolor(s))return null;if(s.gradient&&/^linear-gradient\([a-zA-Z0-9#%.,()\s-]+\)$/.test(s.gradient))return s.gradient;const colors=Array.isArray(s.gradientColors)?s.gradientColors.filter(h=>/^#[a-f0-9]{6}$/i.test(h)):[];if(colors.length>=2)return `linear-gradient(135deg,${colors.join(',')})`;return 'linear-gradient(135deg,#fa91b5,#f7d857,#7be4b9,#7f9eef)';}
function spoolVisual(s){const hex=safeHex(s.hex);const gradient=getGradient(s);const photo=surface(s)==='photo'&&/^data:image\/(png|jpe?g|webp);base64,[a-zA-Z0-9+/=]+$/.test(s.imageUrl||'')?s.imageUrl:null;return `<div class="spool surface-${surface(s)}" style="--spool-color:${hex}" role="img" aria-label="${escapeHTML(s.color)}, ${escapeHTML(FINISHES[surface(s)])}${isMulticolor(s)?', mehrfarbig':''}"><div class="filament" ${gradient?`style="background-image:repeating-radial-gradient(circle,transparent 0 1px,#0002 1.5px 2px),${gradient}"`:photo?`style="background-image:url('${photo}');background-size:cover"`:''}></div><div class="core"></div></div>`;}
function finishLabel(s){return [FINISHES[surface(s)]||'Standard',isMulticolor(s)?'Farbverlauf':null].filter(Boolean).join(' · ');}
function renderMaterials(){const options=['',...new Set(['PLA','PETG',...spools.map(s=>s.material).filter(Boolean)])];$('material-filters').innerHTML=options.map(m=>`<button class="chip" aria-pressed="${m===materialFilter}" data-material="${escapeHTML(m)}">${escapeHTML(m||'Alle')}</button>`).join('');}
function renderStock(){const rows=filteredSpools();const related=rows.filter(x=>x.related).length;const sum=spools.reduce((n,s)=>n+grams(s),0);$('total-weight').textContent=new Intl.NumberFormat('de-CH',{maximumFractionDigits:2}).format(sum/1000);$('stock-count').textContent=`${spools.length} Spulen`;$('low-count').textContent=spools.filter(s=>grams(s)<250).length;$('low-button').setAttribute('aria-pressed',String(lowOnly));$('results').textContent=$('search').value.trim()?`${rows.length-related} genaue Treffer${related?` · ${related} verwandte Farben`:''}`:`${rows.length} Spulen · Direkt 250 g abbuchen`;renderMaterials();$('stock-grid').innerHTML=rows.map(({spool:s,related})=>{const g=grams(s),low=g<250;return `<article class="spool-card ${low?'low':''}"><div class="visual-stage" style="--spool-color:${safeHex(s.hex)}"><span class="stage-id">#${String(s.number).padStart(3,'0')}</span>${spoolVisual(s)}<button class="card-menu" data-edit="${Number(s.number)}" aria-label="Spule ${Number(s.number)} bearbeiten">···</button></div><div class="card-body"><div class="card-meta"><span class="material">${escapeHTML(s.material)}</span><span class="brand-name">${escapeHTML(s.brand||'Ohne Marke')}</span></div><h3 class="card-name">${escapeHTML(s.color||'Ohne Farbnamen')}</h3><div class="finish-name">${escapeHTML(finishLabel(s))}${related?' <span class="related">· Verwandt</span>':''}</div><div class="weight-row"><strong>${displayGrams(g)} <small>g</small></strong><span>von ${displayGrams(Number(s.capacity)||1000)} g</span></div><div class="meter" role="meter" aria-label="Restmenge" aria-valuenow="${g}" aria-valuemin="0" aria-valuemax="${Number(s.capacity)||1000}"><div style="width:${Math.min(100,Math.max(0,Number(s.level)||0))}%"></div></div><div class="card-actions"><button class="subtract" data-book="${Number(s.number)}" data-grams="${low?g:250}" ${g<=0?'disabled':''} aria-label="${low?displayGrams(g)+' g Rest':'250 g'} von Spule ${Number(s.number)} abbuchen">${g===0?'Leer':low?'− '+displayGrams(g)+' g Rest':'− 250 g'}</button><button class="custom-amount" data-custom="${Number(s.number)}" ${g<=0?'disabled':''}>Andere</button></div></div></article>`;}).join('')||`<div class="empty"><h3>${spools.length?'Kein passendes Filament':'Platz für dein Filament'}</h3><p>${spools.length?'Versuche eine andere Farbe oder Oberfläche.':'Erfasse deine erste Spule – Material, Farbe, Gewicht.'}</p><button class="secondary" onclick="${spools.length?'resetFilters()':'openEditor()'}">${spools.length?'Filter zurücksetzen':'＋ Erste Spule erfassen'}</button></div>`;}
function renderShop(){$('shop-list').innerHTML=shopItems.map((s,i)=>`<article class="shopping-row">${spoolVisual(s)}<div class="shop-info"><strong>${escapeHTML(s.color)}</strong><p>${escapeHTML(s.material)} · ${escapeHTML(s.brand||'Ohne Marke')} · ${escapeHTML(finishLabel(s))}</p></div><button class="primary" data-buy="${i}">Gekauft → erfassen</button><button class="quiet" data-shop-edit="${i}">Bearbeiten</button><button class="quiet danger" data-shop-delete="${i}" aria-label="${escapeHTML(s.color)} von der Einkaufsliste entfernen">×</button></article>`).join('')||'<div class="empty"><h3>Alles da?</h3><p>Merke hier Filament für deinen nächsten Einkauf vor.</p></div>';}

function setCardZoom(value,remember=true){let zoom=Number(value);if(!Number.isFinite(zoom))zoom=3;zoom=Math.max(1,Math.min(4,Math.round(zoom)));const names=['Übersicht','Kompakt','Standard','Gross'];$('stock-grid').setAttribute('data-card-zoom',String(zoom));$('card-zoom').value=String(zoom);$('card-zoom').setAttribute('aria-valuetext',names[zoom-1]);$('card-zoom-label').textContent=names[zoom-1];document.querySelectorAll('.card-zoom button').forEach((b,i)=>b.disabled=i===0?zoom===1:zoom===4);if(remember)localStorage.setItem(STORE+'view_zoom',JSON.stringify(zoom));}

function persist(){localStorage.setItem(STORE+'inv',JSON.stringify(spools));localStorage.setItem(STORE+'shop',JSON.stringify(shopItems));localStorage.setItem(STORE+'ams',JSON.stringify(amsSlots));}
function save(booking){localRevision++;if(!DEMO)queueLocalChange(booking);persist();unsentChanges=true;render();if(!DEMO)syncCloud();}
function notify(message,undo=false){clearTimeout(toastTimer);$('toast').innerHTML=`<div class="toast"><span>${escapeHTML(message)}</span>${undo?'<button onclick="undoLast()">Rückgängig</button>':''}<button onclick="hideToast()" aria-label="Meldung schliessen">×</button></div>`;if(!undo)toastTimer=setTimeout(hideToast,5000);}

function book(id,amount){const s=spools.find(s=>Number(s.number)===Number(id));const g=Number(amount);if(!s||!Number.isFinite(g)||g<=0||g>grams(s)+.000001){notify('Die Menge ist nicht verfügbar.');return false;}const before=s.level;const cap=Number(s.capacity)||1000;s.level=Math.max(0,Number(s.level)-g/cap*100);undoStack.push({id:s.number,before,after:s.level,amount:g});if(undoStack.length>30)undoStack.shift();save({number:s.number,grams:g});notify(`${displayGrams(g)} g abgebucht · #${String(id).padStart(3,'0')} · ${displayGrams(grams(s))} g übrig`,true);return true;}
function undoLast(){const last=undoStack.at(-1);if(!last)return;const s=spools.find(s=>s.number===last.id);if(!s||Math.abs(Number(s.level)-last.after)>.000001){notify('Diese Spule wurde inzwischen geändert. Abbuchung kann nicht rückgängig gemacht werden.');return;}s.level=last.before;undoStack.pop();save({number:s.number,grams:-last.amount});notify('Abbuchung rückgängig gemacht.',undoStack.length>0);}

const NAMED_TONES=[

];
function nameColorProposal(value){const text=' '+normal(value).replace(/[^a-z0-9-]+/g,' ').trim()+' ';const found=[];for(const [name,hex,aliases] of NAMED_TONES){for(const alias of aliases){if(text.includes(' '+alias+' '))found.push({name,hex,length:alias.length});}}return found.sort((a,b)=>b.length-a.length)[0]||null;}
function colorNameChanged(value){editDraft.color=value;const proposal=nameColorProposal(value);if(proposal){editDraft.hex=proposal.hex;editDraft.gradientColors[0]=proposal.hex;editDraft.gradient=null;wheelTarget='base';colorAutoNote=`Farbvorschlag ${proposal.name} · im Farbrad anpassbar`;}else colorAutoNote='';renderEditorPreview();}
function hexHSV(hex){const [r,g,b]=rgb(hex),max=Math.max(r,g,b),min=Math.min(r,g,b),delta=max-min;let h=0;if(delta){if(max===r)h=((g-b)/delta)%6;else if(max===g)h=(b-r)/delta+2;else h=(r-g)/delta+4;h=(h*60+360)%360;}return {h,s:max?delta/max:0,v:max};}
function hsvHex(h,s,v){const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;const channels=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];return '#'+channels.map(n=>Math.round((n+m)*255).toString(16).padStart(2,'0')).join('');}
function updateColorWheel(){if(!$('color-wheel'))return;const hex=wheelTarget==='third'?editDraft.gradientColors[2]:wheelTarget==='end'?editDraft.gradientColors[1]:editDraft.hex;const next=hexHSV(hex);if(next.v===0){next.h=wheelHSV.h;next.s=wheelHSV.s;}wheelHSV=next;const wheel=$('color-wheel'),angle=wheelHSV.h*Math.PI/180;wheel.style.setProperty('--wheel-x',(50+Math.cos(angle)*wheelHSV.s*48)+'%');wheel.style.setProperty('--wheel-y',(50+Math.sin(angle)*wheelHSV.s*48)+'%');wheel.style.setProperty('--wheel-darkness',String(1-wheelHSV.v));wheel.setAttribute('aria-valuenow',String(Math.round(wheelHSV.h)));wheel.setAttribute('aria-valuetext','Farbe mit Pfeiltasten anpassen');$('wheel-brightness').value=Math.round(wheelHSV.v*100);$('wheel-base').style.setProperty('--target-color',safeHex(editDraft.hex));$('wheel-end').style.setProperty('--target-color',safeHex(editDraft.gradientColors[1]));$('wheel-third').style.setProperty('--target-color',safeHex(editDraft.gradientColors[2]));$('wheel-third').setAttribute('aria-pressed',String(wheelTarget==='third'));$('wheel-base').setAttribute('aria-pressed',String(wheelTarget==='base'));$('wheel-end').setAttribute('aria-pressed',String(wheelTarget==='end'));$('edit-hex').value=editDraft.hex;$('edit-end').value=editDraft.gradientColors.at(-1);$('color-auto-note').textContent=colorAutoNote;}
function applyWheelColor(){const hex=hsvHex(wheelHSV.h,wheelHSV.s,wheelHSV.v);if(wheelTarget==='third'){editDraft.gradientColors[2]=hex;}else if(wheelTarget==='end'){editDraft.gradientColors[1]=hex;}else{editDraft.hex=hex;editDraft.gradientColors[0]=hex;}editDraft.gradient=null;colorAutoNote='Farbton individuell angepasst';renderEditorPreview();}
function wheelPointer(event,start){if(!start&&!event.buttons)return;const wheel=event.currentTarget;if(start)wheel.setPointerCapture(event.pointerId);event.preventDefault();const rect=wheel.getBoundingClientRect(),x=event.clientX-rect.left-rect.width/2,y=event.clientY-rect.top-rect.height/2;wheelHSV.h=(Math.atan2(y,x)*180/Math.PI+360)%360;wheelHSV.s=Math.min(1,Math.hypot(x,y)/(rect.width/2));if(wheelHSV.v===0)wheelHSV.v=1;applyWheelColor();}
function wheelBrightness(value){wheelHSV.v=Math.max(0,Math.min(1,Number(value)/100));applyWheelColor();}
function wheelKey(event){if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key))return;event.preventDefault();if(event.key==='ArrowLeft')wheelHSV.h=(wheelHSV.h+355)%360;if(event.key==='ArrowRight')wheelHSV.h=(wheelHSV.h+5)%360;if(event.key==='ArrowUp')wheelHSV.s=Math.min(1,wheelHSV.s+.05);if(event.key==='ArrowDown')wheelHSV.s=Math.max(0,wheelHSV.s-.05);applyWheelColor();}

const FINISH_DESCRIPTIONS={plain:'Leicht glänzend',matte:'Weich & fein gekörnt',galaxy:'Funkelnde Partikel',silk:'Seidiger Lichtstreifen',metallic:'Kühle Metallreflexe',translucent:'Lichtdurchlässig',stone:'Mineralische Einschlüsse',cf:'Feine Faserstruktur',wood:'Gewachsene Holzmaserung',glow:'Nachleuchtend im Dunkeln',photo:'Dein Materialfoto'};
function materialSample(s){const gradient=getGradient(s);const photo=surface(s)==='photo'&&/^data:image\/(png|jpe?g|webp);base64,[a-zA-Z0-9+/=]+$/.test(s.imageUrl||'')?s.imageUrl:null;return `<div class="surface-${surface(s)}" style="--spool-color:${safeHex(s.hex)}"><div class="material-sample" ${gradient?`style="background-image:${gradient}"`:photo?`style="background-image:url('${photo}');background-size:cover;background-position:center"`:''} aria-hidden="true">${surface(s)==='glow'?'<span class="glow-labels"><span>Tag</span><span>Dunkel</span></span>':''}</div></div>`;}
function renderEditorPreview(){const showMulti=editDraft.isMulticolor;if(!showMulti)wheelTarget='base';$('end-color').hidden=!showMulti;$('third-color').hidden=!showMulti||editDraft.gradientColors.length<3;$('add-third').hidden=!showMulti||editDraft.gradientColors.length>=3;$('remove-third').hidden=!showMulti||editDraft.gradientColors.length<3;const finishes=['plain','matte','galaxy','silk','metallic','translucent','stone','cf','wood','glow'];if(editDraft.imageUrl)finishes.push('photo');const v=editorVisual();$('finish-picker').innerHTML=finishes.map(f=>`<button type="button" data-finish="${f}" aria-label="${escapeHTML(FINISHES[f])}" aria-pressed="${editDraft.surface===f}">${materialSample({...v,surface:f,look:f})}<span class="finish-title">${escapeHTML(FINISHES[f])}</span><span class="finish-description">${escapeHTML(FINISH_DESCRIPTIONS[f])}</span></button>`).join('');$('editor-preview').innerHTML=`<div class="preview-caption"><div><strong>${escapeHTML(editDraft.color||'Deine Farbe')}</strong><p>${escapeHTML(finishLabel(v))}</p></div><span class="preview-label">Material · Nahansicht</span></div><div class="preview-material">${materialSample(v)}<div class="preview-spool">${spoolVisual(v)}</div></div>`;document.querySelectorAll('[data-swatch]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.swatch===editDraft.hex)));updateColorWheel();}

function editorVisual(){return {...editDraft,look:editDraft.surface,gradient:editDraft.isMulticolor?(editDraft.gradient||`linear-gradient(135deg,${editDraft.gradientColors.map(safeHex).join(',')})`):null,gradientColors:editDraft.isMulticolor?editDraft.gradientColors:null,isMulticolor:editDraft.isMulticolor};}
function readMaterialPhoto(input){const f=input.files[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)){notify('Bitte ein PNG-, JPEG- oder WebP-Bild wählen.');return;}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const scale=Math.min(1,220/Math.max(img.width,img.height));c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);editDraft.imageUrl=c.toDataURL('image/jpeg',.75);editDraft.surface='photo';renderEditorPreview();};img.src=reader.result;};reader.readAsDataURL(f);}
function submitEditor(again=false){const form=$('editor-form');if(!form.reportValidity())return false;const color=$('edit-color').value.trim();const capacity=editContext==='shop'?1000:Number($('edit-capacity').value);const remaining=editContext==='shop'?1000:Number($('edit-remaining').value);if(!color||!Number.isFinite(capacity)||capacity<=0||!Number.isFinite(remaining)||remaining<0||remaining>capacity){$('editor-error').textContent='Bitte Farbname und gültige Gewichte angeben. Die Restmenge darf die volle Spule nicht übersteigen.';return false;}editDraft.color=color;const d={...editorVisual(),material:$('edit-material').value,brand:$('edit-brand').value.trim(),capacity,level:remaining/capacity*100,note:$('edit-note').value.trim()};if(editContext==='shop'){if(editId===null)shopItems.push(d);else shopItems[editId]=d;}else if(editId!==null){const current=spools.find(s=>s.number===editId);if(!current){$('editor-error').textContent='Diese Spule wurde inzwischen entfernt.';return false;}Object.assign(current,d);}else{let number=1;while(spools.some(s=>s.number===number))number++;spools.push({...d,number,createdAt:new Date().toISOString()});if(shopSource!==null){shopItems.splice(shopSource,1);shopSource=null;}}
 localStorage.setItem(STORE+'defaults',JSON.stringify({material:d.material,brand:d.brand}));save();if(again){editId=null;editDraft=d;$('editor-error').textContent='Gespeichert. Du kannst die nächste Spule direkt erfassen.';notify('Spule gespeichert. Nächste gleiche Spule bereit.');}else{$('editor').close();notify(editContext==='shop'?'Auf Einkaufsliste gespeichert.':'Filament gespeichert.');}return true;}
function addEditedToShop(){const s=spools.find(s=>s.number===editId);if(s){const {number,...item}=s;shopItems.push(structuredClone(item));save();notify('Filament auf Einkaufsliste gesetzt.');}}
function deleteShop(i){const removed=shopItems.splice(i,1)[0];if(!removed)return;save();notify('Von Einkaufsliste entfernt.');}
function exportData(){const data=JSON.stringify({inv:spools,shop:shopItems,ams:amsSlots,date:new Date().toISOString(),version:13},null,2);const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=`filament-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Backup erstellt.');}

function exportBeforeSync(){const raw=localStorage.getItem(STORE+'before_first_sync');if(!raw){notify('Keine frühere Sicherung vorhanden.');return;}const state=JSON.parse(raw);const blob=new Blob([JSON.stringify({inv:state.spools,shop:state.shopItems,ams:state.amsSlots,date:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='filament-vor-geraeteverbindung.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}

function validRecord(s,inventory){return s&&typeof s==='object'&&typeof s.material==='string'&&typeof s.color==='string'&&(!inventory||(Number.isSafeInteger(s.number)&&s.number>0&&typeof s.level==='number'&&s.level>=0&&s.level<=100&&(!s.capacity||(typeof s.capacity==='number'&&s.capacity>0&&s.capacity<=100000))));}
function importFile(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);const inventory=data.inv??data.spools,shopping=data.shop??data.shopItems??[];if(!Array.isArray(inventory)||!inventory.every(s=>validRecord(s,true))||new Set(inventory.map(s=>s.number)).size!==inventory.length||!Array.isArray(shopping)||!shopping.every(s=>validRecord(s,false)))throw Error('Format');const preview=$('import-preview');preview.textContent=`${inventory.length} Spulen und ${shopping.length} Einkaufspositionen. Dein aktueller Bestand wird ersetzt. Eine lokale Sicherung wird vorher erstellt.`;const button=$('apply-import');button.hidden=false;button.onclick=()=>{localStorage.setItem(STORE+'before_import',JSON.stringify({inv:spools,shop:shopItems,ams:amsSlots}));spools=inventory;shopItems=shopping;amsSlots=Array.isArray(data.ams)?data.ams:amsSlots;undoStack=[];save();$('data-dialog').close();notify('Backup importiert.');};}catch{$('import-preview').textContent='Dieses Backup konnte nicht gelesen werden. Bitte ein Filament-Backup wählen.';}};reader.readAsText(file);input.value='';}
function openData(){$('data-dialog').innerHTML=`<div class="dialog-head"><div><h2 id="data-title">Daten & Backup</h2><p>Bestand sichern und bestehende Backups übernehmen.</p></div><button class="close" aria-label="Schliessen" onclick="document.getElementById('data-dialog').close()">×</button></div><div class="dialog-content backup-list"><div class="settings-note">${DEMO?'Du bist in der Vorschau. Diese Beispieldaten sind vom echten Bestand getrennt.':'Dein Bestand wird lokal gespeichert. Nach einmaliger Google-Anmeldung wird er automatisch zwischen deinen Geräten abgeglichen.'}</div><button class="secondary" onclick="exportData()">↓ Bestand als Backup herunterladen</button>${localStorage.getItem(STORE+'before_first_sync')?'<button class="secondary" onclick="exportBeforeSync()">↓ Sicherung vor der Geräteverbindung herunterladen</button>':''}<button class="secondary" onclick="document.getElementById('backup-file').click()">↑ Bestehendes Backup auswählen</button><input id="backup-file" class="file-input" type="file" accept="application/json,.json" onchange="importFile(this)"><p id="import-preview" class="small muted" role="status"></p><button id="apply-import" class="primary" hidden>Backup übernehmen und Bestand ersetzen</button><div class="settings-note">${DEMO?'Du kannst Erfassen, Filtern und Abbuchen frei ausprobieren.':'Cloud-Status: '+escapeHTML($('sync-state').textContent.trim())} ${!DEMO?'Einkaufsliste und AMS-Zuordnungen bleiben im Backup enthalten.':''}</div></div>`;$('data-dialog').showModal();}
function setSync(text,online=false){$('sync-state').classList.toggle('online',online);$('sync-state').querySelector('span').textContent=text;updateAccountButton();}

async function loadScript(url){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=url;s.onload=resolve;s.onerror=reject;document.head.appendChild(s);});}
// Each queued change is persisted locally and applied once in a Firestore transaction.
let signedInUser=null,authHandle=null,authUnsubscribe=null,cloudUnsubscribe=null,cloudError='',cloudBase=null;
let pendingChanges=readStored('pending_changes',[]),syncShadow=takeSyncState();
function takeSyncState(){return JSON.parse(JSON.stringify({spools,shopItems,amsSlots}));}
function canonicalData(value){if(Array.isArray(value))return value.map(canonicalData);if(value&&typeof value==='object')return Object.fromEntries(Object.keys(value).sort().map(key=>[key,canonicalData(value[key])]));return value;}
function sameData(a,b){return JSON.stringify(canonicalData(a??null))===JSON.stringify(canonicalData(b??null));}
function diffSyncStates(before,after,booking){const ops=[];for(const old of before.spools){if(!after.spools.some(s=>s.number===old.number))ops.push({type:'remove',number:old.number,expected:old});}for(const next of after.spools){const old=before.spools.find(s=>s.number===next.number);if(!old){ops.push({type:'create',spool:next});continue;}const fields={};for(const k of new Set([...Object.keys(old),...Object.keys(next)])){if(k==='number'||sameData(old[k],next[k]))continue;if(k==='level'&&booking?.number===next.number)continue;fields[k]={before:old[k]??null,after:next[k]??null};}if(Object.keys(fields).length)ops.push({type:'patch',number:next.number,fields});}if(booking)ops.push({type:'consume',number:booking.number,grams:booking.grams});for(const k of ['shopItems','amsSlots'])if(!sameData(before[k],after[k]))ops.push({type:'replace',key:k,before:before[k],after:after[k]});return ops;}
function applySyncOps(state,ops){const next=JSON.parse(JSON.stringify(state));for(const op of ops){if(op.type==='create'){const found=next.spools.find(s=>s.number===op.spool.number);if(found&&!sameData(found,op.spool))throw Error(`Spulen-ID #${op.spool.number} wurde auf einem anderen Gerät vergeben.`);if(!found)next.spools.push(op.spool);}else if(op.type==='remove'){const found=next.spools.find(s=>s.number===op.number);if(found&&!sameData(found,op.expected))throw Error(`Spule #${op.number} wurde inzwischen geändert.`);next.spools=next.spools.filter(s=>s.number!==op.number);}else if(op.type==='patch'){const found=next.spools.find(s=>s.number===op.number);if(!found)throw Error(`Spule #${op.number} fehlt im gemeinsamen Bestand.`);for(const [key,change] of Object.entries(op.fields)){if(!sameData(found[key],change.before)&&!sameData(found[key],change.after))throw Error(`Spule #${op.number}: gleichzeitige Bearbeitung. Dein lokales Backup bleibt erhalten.`);found[key]=change.after;}}else if(op.type==='consume'){const found=next.spools.find(s=>s.number===op.number);if(!found)throw Error(`Spule #${op.number} fehlt im gemeinsamen Bestand.`);const capacity=Number(found.capacity)||1000;const remaining=grams(found)-op.grams;if(remaining<-.001||remaining>capacity+.001)throw Error(`Spule #${op.number}: Die Restmenge hat sich auf einem anderen Gerät geändert.`);found.level=Math.max(0,Math.min(100,remaining/capacity*100));}else if(op.type==='replace'){if(!sameData(next[op.key],op.before)&&!sameData(next[op.key],op.after))throw Error('Gleichzeitige Änderung der Einkaufsliste oder AMS-Zuordnung. Bitte unter Geräte & Sync prüfen.');next[op.key]=op.after;}}return next;}
function syncStateFromDoc(data){return {spools:Array.isArray(data?.spools)?data.spools:[],shopItems:Array.isArray(data?.shopItems)?data.shopItems:[],amsSlots:Array.isArray(data?.amsSlots)?data.amsSlots:[null,null,null,null]};}
function storeQueue(){localStorage.setItem(STORE+'pending_changes',JSON.stringify(pendingChanges));}
function adoptCloud(state){let merged=state;try{for(const batch of pendingChanges)merged=applySyncOps(merged,batch.ops);}catch(e){cloudError=e.message;setSync('Änderungskonflikt · lokal gesichert');updateAccountButton();return false;}spools=merged.spools;shopItems=merged.shopItems;amsSlots=merged.amsSlots;syncShadow=takeSyncState();persist();render();return true;}
function queueLocalChange(booking){const after=takeSyncState();const ops=diffSyncStates(syncShadow,after,booking);if(ops.length)pendingChanges.push({id:crypto.randomUUID(),seed:syncShadow,ops});syncShadow=after;storeQueue();}
function friendlyCloudError(error){const code=error?.code||'';if(code.includes('permission-denied'))return 'Zugriff verweigert. Bitte mit deinem freigegebenen Google-Konto anmelden.';if(code.includes('unauthorized-domain'))return 'Diese Webadresse ist in Firebase noch nicht für die Anmeldung freigegeben.';if(code.includes('popup-blocked'))return 'Bitte das Google-Anmeldefenster im Browser erlauben und erneut versuchen.';if(code.includes('operation-not-allowed'))return 'Die Google-Anmeldung muss in Firebase aktiviert sein.';if(code.includes('resource-exhausted'))return 'Gratislimit erreicht. Änderungen bleiben lokal gespeichert.';if(code.includes('popup-closed')||code.includes('cancelled-popup'))return 'Anmeldung abgebrochen. Du kannst es erneut versuchen.';return error?.message||'Keine Verbindung. Änderungen bleiben lokal gespeichert.';}
function updateAccountButton(){const b=$('account-button');if(!b)return;const online=$('sync-state').classList.contains('online');b.classList.toggle('online',online);b.textContent=online?'◉ Synchronisiert':signedInUser?'◉ Geräte & Sync':'◉ Geräte verbinden';b.title=$('sync-state').querySelector('span').textContent;}
function openAccount(){const ready=Boolean(signedInUser);$('account-dialog').innerHTML=`<div class="dialog-head"><div><h2 id="account-title">Geräte synchronisieren</h2><p>${DEMO?'Die Vorschau verwendet getrennte Beispieldaten.':ready?'Mit demselben Google-Konto auf allen Geräten.':'Einmal anmelden. Danach bleibt dein Konto auf diesem Gerät angemeldet.'}</p></div><button class="close" aria-label="Schliessen" onclick="document.getElementById('account-dialog').close()">×</button></div><div class="dialog-content backup-list"><div class="settings-note">${DEMO?'Die echte Synchronisierung ist in der veröffentlichten App verfügbar.':ready?'Angemeldet: '+escapeHTML(signedInUser.email):'Dein Bestand wird nur für dein Google-Konto freigegeben.'}</div><p class="small muted" id="account-status">${escapeHTML(cloudError|| (ready?pendingChanges.length+' Änderungen warten auf Abgleich.':'Keine regelmässige Neuanmeldung erforderlich.'))}</p>${DEMO?'':ready?'<button class="primary" onclick="cloudError=\'\';syncCloud();">Jetzt abgleichen</button>':'<button id="google-login-button" class="primary" onclick="signInGoogle()" '+(!authHandle?'disabled':'')+'>Mit Google anmelden</button>'}<button class="secondary" onclick="exportData()">Lokales Backup herunterladen</button>${ready?'<button class="secondary" onclick="signOutGoogle()">Auf diesem Gerät abmelden</button>':''}${cloudError&&ready?'<button class="secondary" onclick="acceptCloudVersion()">Cloud-Bestand laden · lokale Version sichern</button>':''}<p class="small muted">Kostenloser Spark-Tarif. Offline-Änderungen werden auf diesem Gerät gespeichert und nach der Verbindung abgeglichen.</p></div>`;$('account-dialog').showModal();}
async function signInGoogle(){if(!authHandle)return;try{cloudError='';const provider=new firebase.auth.GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});await authHandle.signInWithPopup(provider);$('account-dialog').close();}catch(e){cloudError=friendlyCloudError(e);if($('account-status'))$('account-status').textContent=cloudError;notify(cloudError);}}
async function signOutGoogle(){if(authHandle)await authHandle.signOut();$('account-dialog').close();notify('Auf diesem Gerät abgemeldet.');}
async function acceptCloudVersion(){if(!cloudBase)return;localStorage.setItem(STORE+'before_sync_conflict',JSON.stringify(takeSyncState()));pendingChanges=[];storeQueue();cloudError='';adoptCloud(cloudBase);setSync('Cloud synchronisiert',true);$('account-dialog').close();notify('Cloud-Bestand geladen. Die vorherige lokale Version wurde zusätzlich gesichert.');}
async function initCloud(){if(location.protocol==='file:'){setSync('Lokal · GitHub-Link für Sync öffnen');return;}setSync('Verbindung wird vorbereitet …');try{for(const name of ['app','auth','firestore'])await loadScript(`https://www.gstatic.com/firebasejs/11.6.1/firebase-${name}-compat.js`);if(!firebase.apps.length)firebase.initializeApp(MY_CONFIG);db=firebase.firestore();authHandle=firebase.auth();await authHandle.setPersistence(firebase.auth.Auth.Persistence.LOCAL);if(authUnsubscribe)authUnsubscribe();authUnsubscribe=authHandle.onAuthStateChanged(async user=>{if(cloudUnsubscribe)cloudUnsubscribe();cloudUnsubscribe=null;cloudReady=false;cloudLoaded=false;signedInUser=null;if(!user){setSync('Lokal gespeichert · einmal anmelden');updateAccountButton();return;}signedInUser=user;updateAccountButton();setSync('Gemeinsamen Bestand laden …');const ref=db.collection('filament_app').doc('state');try{const initial=await db.runTransaction(async tx=>{const snap=await tx.get(ref);if(snap.exists){const remote=syncStateFromDoc(snap.data());const localSeed=pendingChanges[0]?.seed||takeSyncState();if(!remote.spools.length&&localSeed.spools.length){remote.spools=localSeed.spools;if(!remote.shopItems.length)remote.shopItems=localSeed.shopItems;if(remote.amsSlots.every(x=>x===null))remote.amsSlots=localSeed.amsSlots;assertCloudSize(remote);tx.set(ref,{...remote,version:13},{merge:true});}return remote;}const seed=pendingChanges[0]?.seed||takeSyncState();assertCloudSize(seed);tx.set(ref,{...seed,version:13});return seed;});if(spools.length&&!localStorage.getItem(STORE+'before_first_sync'))localStorage.setItem(STORE+'before_first_sync',JSON.stringify(takeSyncState()));cloudBase=initial;cloudReady=true;cloudLoaded=true;cloudError='';if(!pendingChanges.length&&adoptCloud(initial))setSync('Cloud synchronisiert',true);cloudUnsubscribe=ref.onSnapshot(snap=>{if(!snap.exists||snap.metadata.hasPendingWrites)return;cloudBase=syncStateFromDoc(snap.data());if(!writeInFlight&&!pendingChanges.length){if(adoptCloud(cloudBase))setSync('Cloud synchronisiert',true);}} ,e=>{cloudError=friendlyCloudError(e);cloudReady=false;setSync('Offline · lokal gespeichert');});syncCloud();}catch(e){cloudError=friendlyCloudError(e);setSync('Lokal gespeichert · Sync prüfen');notify(cloudError);}});const button=$('google-login-button');if(button)button.disabled=false;}catch(e){cloudError=friendlyCloudError(e);setSync('Offline · lokal gespeichert');}}
function assertCloudSize(state){if(new Blob([JSON.stringify(state)]).size>850000)throw Error('Dein Bestand enthält zu viele Bilddaten für ein einzelnes Cloud-Dokument. Bitte einige Materialfotos entfernen; dein Bestand ist lokal gesichert.');}
async function syncCloud(){if(DEMO||!cloudReady||!cloudLoaded||!signedInUser||cloudError||writeInFlight||!pendingChanges.length)return;writeInFlight=true;setSync('Wird synchronisiert …');try{while(pendingChanges.length){const batch=pendingChanges[0];const stateRef=db.collection('filament_app').doc('state');const receiptRef=db.collection('filament_sync_ops').doc(batch.id);const result=await db.runTransaction(async tx=>{const [snap,receipt]=await Promise.all([tx.get(stateRef),tx.get(receiptRef)]);const remote=snap.exists?syncStateFromDoc(snap.data()):batch.seed;if(receipt.exists)return remote;const merged=applySyncOps(remote,batch.ops);assertCloudSize(merged);tx.set(stateRef,{...merged,version:13},{merge:true});tx.set(receiptRef,{createdAt:firebase.firestore.FieldValue.serverTimestamp()});return merged;});pendingChanges.shift();storeQueue();cloudBase=result;}cloudError='';adoptCloud(cloudBase);setSync('Cloud synchronisiert',true);}catch(e){cloudError=friendlyCloudError(e);setSync('Lokal gesichert · Sync ausstehend');notify(cloudError);}finally{writeInFlight=false;updateAccountButton();}}
window.addEventListener('online',()=>{cloudError='';if(!cloudReady&&!DEMO)initCloud();else syncCloud();});

document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;const d=b.dataset;if('editMaterial'in d){chooseMaterial(d.editMaterial);return;}if('brand'in d){chooseBrand(d.brand);return;}if('material'in d){materialFilter=d.material;renderStock();}else if('edit'in d)openEditor(Number(d.edit));else if('book'in d)book(Number(d.book),Number(d.grams));else if('custom'in d)openBooking(Number(d.custom));else if('finish'in d){editDraft.surface=d.finish;renderEditorPreview();}else if('swatch'in d){editDraft.hex=d.swatch;editDraft.color=d.name;editDraft.gradientColors[0]=d.swatch;editDraft.gradient=null;$('edit-color').value=d.name;$('edit-hex').value=d.swatch;renderEditorPreview();}else if('bookingPreset'in d){if(book(activeBooking,Number(d.bookingPreset)))$('booking').close();}else if('buy'in d)openEditor(null,'stock',Number(d.buy));else if('shopEdit'in d)openEditor(Number(d.shopEdit),'shop');else if('shopDelete'in d)deleteShop(Number(d.shopDelete));});
document.addEventListener('submit',event=>{if(event.target.id==='editor-form'){event.preventDefault();submitEditor();}if(event.target.id==='booking-form'){event.preventDefault();if(book(activeBooking,Number($('booking-amount').value)))$('booking').close();}});
for(const id of ['editor','booking','data-dialog','account-dialog'])$(id).addEventListener('click',event=>{if(event.target===$(id)){const r=$(id).getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)$(id).close();}});
window.addEventListener('storage',event=>{if(event.key===STORE+'inv'||event.key===STORE+'shop'||event.key===STORE+'pending_changes'){spools=readStored('inv',spools);shopItems=readStored('shop',shopItems);if(!writeInFlight){pendingChanges=readStored('pending_changes',pendingChanges);syncShadow=takeSyncState();}render();}});
setCardZoom(readStored('view_zoom',3),false);$('demo-banner').hidden=!DEMO;if(DEMO)setSync('Demo · lokal gespeichert');render();if(!DEMO)initCloud();
